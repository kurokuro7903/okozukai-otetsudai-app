<title>PCパーツ適合チェッカー Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

   LAYOUT: 上部ナビ（スマホは下部タブ）、最大1080px、カードと罫線の表 */
:root{color-scheme:light dark;
--bg:light-dark(#f6f5f1,#111719);--card:light-dark(#fdfcf9,#182124);--ink:light-dark(#1c2326,#e8ecea);--mut:light-dark(#646b6d,#9aa5a6);

:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip}
a{color:var(--pri)}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(3vw,16px);background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;font-family:var(--disp);font-weight:700;font-size:16px}
.brand i{font-style:normal;font-family:var(--mono);font-size:12px;background:var(--pri);color:var(--prifg);padding:2px 6px;border-radius:4px}
.brand b{color:var(--pri);font-weight:900}
.sync{font-size:12px;color:var(--mut);white-space:nowrap}
nav.top{display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--mut);padding:8px 12px;border-radius:6px;font-size:14px;font-weight:500;white-space:nowrap}
nav a.on{color:var(--pri);background:var(--acc)}
nav.bottom{display:none}
main{max-width:1080px;margin:0 auto;padding:20px max(3vw,16px) 40px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px}
h1{font-family:var(--disp);font-weight:900;font-size:clamp(22px,3vw,30px);line-height:1.25;margin:0;text-wrap:balance}
h2{font-family:var(--disp);font-size:17px;margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.lead,.hint{color:var(--mut);font-size:13px;margin:6px 0}
input,select,textarea{font:16px "Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:6px;border:1px solid var(--pri);background:var(--pri);color:var(--prifg);cursor:pointer;font-weight:500;text-decoration:none;font-size:14px}
.btn.o{background:transparent;color:var(--pri)}.btn.g{background:transparent;border-color:transparent;color:var(--mut)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.searchrow{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:8px;margin-top:10px}
.searchrow input{font-family:var(--mono);height:48px}
.chip{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 10px;cursor:pointer}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.mc{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.mc:hover{border-color:var(--pri)}
.mk{font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mk b{color:var(--pri)}
.tag{margin-left:auto;font-size:11px;border-radius:4px;padding:0 6px;border:1px solid var(--ok);color:var(--ok)}
.tag.p{border:1px dashed var(--mut);color:var(--mut)}
.nm{font-family:var(--disp);font-weight:700;font-size:16px}
.codes{display:flex;flex-wrap:wrap;gap:4px}
code{font-family:var(--mono);font-size:12px;background:var(--muted);border-radius:4px;padding:1px 6px}
code.hit{background:var(--acc);outline:1px solid var(--pri)}
.facts{font-size:12px;color:var(--mut);border-top:1px solid var(--line);padding-top:6px;margin-top:auto;display:flex;flex-wrap:wrap;gap:2px 12px}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--mut)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sr{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.sr:last-child{border-bottom:0}
.sl{font-size:13px;color:var(--mut)}
.v{font-family:var(--mono);font-weight:600;font-size:14px;word-break:break-word}
.note{display:block;font-size:12px;color:var(--mut)}
.src{display:block;font-family:var(--mono);font-size:11px;text-decoration:none;word-break:break-all}
.unk{display:inline-block;font-size:12px;color:var(--mut);border:1px dashed var(--mut);border-radius:4px;padding:0 6px}
.conf{border:1px solid var(--warn);background:var(--warnbg);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:4px}
.conf>b{font-size:12px;color:var(--warn)}
.notice{border:1px solid var(--warn);background:var(--warnbg);border-radius:6px;padding:8px 12px;font-size:14px;margin-top:8px}
.pend{border:1px dashed var(--mut);border-radius:6px;padding:10px;font-size:14px;color:var(--mut);margin-top:8px}
.vd{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap;border:1px solid}
.vd b{font-size:15px}
.vd.ok{color:var(--ok);background:var(--okbg)}.vd.warn{color:var(--warn);background:var(--warnbg)}.vd.ng{color:var(--ng);background:var(--ngbg)}.vd.unknown{color:var(--mut);background:var(--muted);border-style:dashed}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--mut);min-height:44px}
.tabs button.on{color:var(--pri);border-color:var(--pri);font-weight:700}
.pi{border-bottom:1px solid var(--line)}
.ph{width:100%;display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;background:none;border:0;cursor:pointer;text-align:left;min-height:44px}
.ph:hover{background:var(--muted)}
.price{font-family:var(--mono);font-size:13px;white-space:nowrap;text-align:right}.price small{display:block;font-size:11px;color:var(--mut)}
.pb{padding:0 4px 12px}
.pb ul{margin:0 0 8px;padding-left:1.2em;font-size:14px}
.shop{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;text-decoration:none;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:500;border-bottom:1px solid var(--line);padding:6px 4px}
td{border-bottom:1px solid var(--line);padding:8px 4px;vertical-align:top}
.num{text-align:right;font-family:var(--mono);white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

.qty{display:inline-flex;align-items:center;gap:6px}.qty button{width:32px;height:32px;border:1px solid var(--line);background:var(--bg);border-radius:4px;cursor:pointer}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
fieldset{border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 12px;background:var(--card)}
legend{font-family:var(--disp);font-weight:700;padding:0 6px}
.err{color:var(--ng);font-weight:700;font-size:14px}
.list li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.list{list-style:none;margin:0;padding:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
footer{max-width:1080px;margin:0 auto;padding:0 max(3vw,16px) 100px;font-size:12px;color:var(--mut)}
@media(max-width:760px){

 nav.bottom a{display:flex;flex-direction:column;align-items:center;font-size:11px;padding:8px 0 10px;border-radius:0;min-height:52px;justify-content:center}
 nav.bottom a span{font-size:18px;line-height:1}
 .searchrow,.two{grid-template-columns:1fr}
 .sr{grid-template-columns:90px minmax(0,1fr)}
 .ph{grid-template-columns:82px minmax(0,1fr) auto;gap:6px}
 table .hm{display:none}
 .sync{display:none}
}

 for(const m of pool){const codes=[...m.orderCodes,...m.productCodes];const tx=[m.name,m.series,m.maker,...m.aliases,...codes].map(norm);
  if(!words.every(w=>tx.some(t=>t.includes(w))))continue;let sc=10,mt=m.name;
  codes.forEach(c=>{const n=norm(c);if(n===whole){sc=Math.max(sc,100);mt=c;}else if(n.startsWith(whole)){sc=Math.max(sc,80);mt=c;}else if(n.includes(whole)){sc=Math.max(sc,60);mt=c;}});
  if(norm(m.name).includes(whole))sc=Math.max(sc,50);if(m.researched)sc+=1;hits.push({m,mt,sc});}
 hits.sort((a,b)=>b.sc-a.sc);let near=[];
 if(!hits.length){for(let L=whole.length-1;L>=5&&!near.length;L--){const pre=whole.slice(0,L);const seen=new Set();
  pool.forEach(m=>[...m.orderCodes,...m.productCodes].forEach(c=>{if(norm(c).startsWith(pre)&&!seen.has(m.id)){seen.add(m.id);near.push({m,mt:c});}}));}}

function modelForm(m,preset,reqSrc,label){const v=formVals(m,preset);
 const I=(k,l,ph,t)=>`<label class="f">${l}<input name="${k}" type="${t||"text"}" value="${esc(v[k])}" placeholder="${esc(ph||"")}"></label>`;
 const SEL=(k,l,opts,noU)=>`<label class="f">${l}<select name="${k}">${noU?"":`<option value="${U}">要確認（不明）</option>`}${opts.map(([a,b])=>`<option value="${esc(a)}" ${v[k]===a?"selected":""}>${esc(b)}</option>`).join("")}</select></label>`;
 return `<form id="mf"><fieldset><legend>機種</legend><div class="fg">${I("maker","メーカー","NEC / 富士通 / DELL …")}${I("series","シリーズ","Mate タイプML")}${I("name","機種名（必須）","Mate タイプML MKT44/L-F")}${I("formFactor","筐体","タワー / SFF / Micro / ノート")}${I("orderCodes","注文型番（カンマ区切り）","PC-MKT44LZ85HZF")}${I("productCodes","製品型番・型名（カンマ区切り）","MKT44/L-F")}
 ${SEL("category","種別",[["desktop","デスクトップ"],["workstation","ワークステーション"],["notebook","ノートPC"],["bto","自作・BTO"]],true)}${I("cpu","CPU","Core i5-12400")}${I("cpuGen","CPU世代（Win11判定に使用）","Intel 第12世代 / AMD Ryzen 5000")}</div></fieldset>
 <fieldset><legend>メモリー</legend><div class="fg">${SEL("memType","規格",[["DDR3","DDR3"],["DDR4","DDR4"],["DDR5","DDR5"],["LPDDR4x","LPDDR4x（オンボード）"],["LPDDR5","LPDDR5（オンボード）"]])}${SEL("memForm","形状",[["DIMM","DIMM（デスクトップ用）"],["SO-DIMM","SO-DIMM（ノート・小型用）"],["オンボード","オンボード（増設不可）"]])}
 ${I("memSpeed","速度（例 3200）","3200","number")}${I("memStd","標準搭載GB","8","number")}${I("memSlots","スロット数","2","number")}${I("memFree","空きスロット","1","number")}${I("memMax","最大容量GB","32","number")}${SEL("ecc","ECC",[["yes","ECC対応"],["no","non-ECC"]])}</div></fieldset>
 <fieldset><legend>ストレージ・拡張・電源</legend><div class="fg">${I("m2Sizes","M.2対応サイズ（例 2280,2242）","2280")}${SEL("m2Iface","M.2接続",[["NVMe","NVMeのみ"],["SATA","SATAのみ"],["NVMe/SATA","NVMe・SATA両対応"]])}${I("bay25","2.5インチベイ数","1","number")}
 ${SEL("gpuSlot","GPU用スロット",[["x16","PCIe x16（フルサイズ可）"],["x16-lp","PCIe x16 ロープロファイル専用"],["x8-lp","PCIe x8 ロープロファイル"],["none","なし"],["custom-only","カスタムメイド専用"]])}${I("gpuLen","カード長上限mm","","number")}${SEL("psuType","電源の種類",[["専用","専用電源（交換不可）"],["ATX","ATX"],["SFX","SFX"],["ACアダプタ","ACアダプタ"]])}${I("psuWatt","電源容量W","","number")}</div>
 <label class="f" style="margin-top:10px">注意書き（任意）<textarea name="note" rows="2" placeholder="例：情報源で最大容量が異なる 等"></textarea></label></fieldset>
 <fieldset><legend>出典${reqSrc?"（必須）":"（任意）"}</legend><div class="fg"><label class="f">出典URL<input name="srcUrl" placeholder="https://…"></label><label class="f">出典名<input name="srcLabel" placeholder="ELECOMメモナビ など"></label><label class="f">確認日<input name="srcDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label></div><p class="hint">空欄の項目は「要確認」として扱われます。入力した値にはこの出典が紐づきます。</p></fieldset>
 ${UI.err?`<p class="err">${esc(UI.err)}</p>`:""}<button class="btn" type="submit">${label}</button></form>`;}
function readForm(form,prev,reqSrc){const fd=Object.fromEntries(new FormData(form).entries());
 if(!String(fd.name||"").trim())return "機種名を入力してください。";
 const url=String(fd.srcUrl||"").trim();if(reqSrc&&!/^https?:\/\//.test(url))return "出典URL（https://〜）は必須です。";
 const has=!!url,sid="user-"+Date.now(),src=has?[sid]:[];
 const keep=(val,old)=>{if(val===null)return{v:null};if(old&&old.v!==null&&JSON.stringify(old.v)===JSON.stringify(val))return old;return{v:val,src,note:has?undefined:"ユーザー入力（出典なし）"};};
 const num=k=>String(fd[k]||"").trim()===""?null:Number(fd[k]),str=k=>{const x=String(fd[k]||"").trim();return x===""||x===U?null:x;},list=k=>String(fd[k]||"").split(/[,、\s]+/).map(x=>x.trim()).filter(Boolean);
 const b=blank({id:prev?prev.id:"um-"+Date.now(),userAdded:true});
 return Object.assign(b,{maker:String(fd.maker).trim()||"その他",series:String(fd.series).trim()||String(fd.maker).trim(),name:String(fd.name).trim(),orderCodes:list("orderCodes"),productCodes:list("productCodes"),aliases:prev?prev.aliases:[],category:fd.category,formFactor:String(fd.formFactor).trim()||"要確認",
  cpu:keep(str("cpu"),prev&&prev.cpu),cpuGen:keep(str("cpuGen"),prev&&prev.cpuGen),cpuReplace:prev?prev.cpuReplace:{v:null},tpm:prev?prev.tpm:{v:null},
  mem:{type:keep(str("memType"),prev&&prev.mem.type),form:keep(str("memForm"),prev&&prev.mem.form),speed:keep(num("memSpeed"),prev&&prev.mem.speed),standardGB:keep(num("memStd"),prev&&prev.mem.standardGB),slots:keep(num("memSlots"),prev&&prev.mem.slots),freeSlots:keep(num("memFree"),prev&&prev.mem.freeSlots),maxGB:keep(num("memMax"),prev&&prev.mem.maxGB),ecc:keep(fd.ecc===U?null:fd.ecc==="yes",prev&&prev.mem.ecc)},
  storage:{m2Sizes:keep(list("m2Sizes").length?list("m2Sizes"):null,prev&&prev.storage.m2Sizes),m2Iface:keep(str("m2Iface"),prev&&prev.storage.m2Iface),bay25:keep(num("bay25"),prev&&prev.storage.bay25),bay35:prev?prev.storage.bay35:{v:null}},
  gpu:{slot:keep(str("gpuSlot"),prev&&prev.gpu.slot),maxLengthMm:keep(num("gpuLen"),prev&&prev.gpu.maxLengthMm),auxPower:prev?prev.gpu.auxPower:{v:null}},
  psu:{type:keep(str("psuType"),prev&&prev.psu.type),watt:keep(num("psuWatt"),prev&&prev.psu.watt)},
  notes:[...(prev?prev.notes:[]),...(String(fd.note||"").trim()?[String(fd.note).trim()]:[])],
  sources:[...(prev?prev.sources:[]),...(has?[{id:sid,label:String(fd.srcLabel||"").trim()||url,url,checked:String(fd.srcDate||D)}]:[])]});}

function vEst(){return `<section class="card"><h1>推定モード</h1><p class="lead">収録されていない機種でも、分かっている仕様（PCのシール、取扱説明書、CPU-Zなど）を入力すれば適合判定できます。分からない項目は「要確認」のままで大丈夫です。入力内容は検索結果には出ません。</p></section>${modelForm(UI.preset?null:ST.estimate,UI.preset?"推定："+UI.preset:"",false,"この仕様で適合判定する")}`;}

function vData(){const ed=UI.edit?getModel(UI.edit):null,pf=UI.pf,c=pf.category;
 const PI=(k,l,t,ph)=>`<label class="f">${l}<input data-pf="${k}" type="${t||"text"}" value="${esc(pf[k]||"")}" placeholder="${esc(ph||"")}"></label>`;
 const PS=(k,l,o)=>`<label class="f">${l}<select data-pf="${k}">${o.map(([a,b])=>`<option value="${a}" ${(pf[k]||o[0][0])===a?"selected":""}>${b}</option>`).join("")}</select></label>`;
 return `<h1>データ管理</h1><div class="tabs">${[["model","型番の登録・修正"],["part","パーツの登録"],["list","登録済み"],["backup","バックアップ"]].map(([k,l])=>`<button class="${UI.dtab===k?"on":""}" data-dtab="${k}">${l}</button>`).join("")}</div>
 ${UI.dtab==="model"?`<p class="hint">${ed?`「${esc(ed.name)}」の仕様を追加・修正します。変更した値には今回の出典が紐づきます。`:"Webで調べた型番の仕様を登録します。出典URLは必須です。調べていない項目は空欄（要確認）のままにしてください。"}</p>${modelForm(ed,UI.preset,true,ed?"修正を保存":"型番を登録")}`:""}
 ${UI.dtab==="part"?`<section class="card"><div class="fg">${PS("category","種類",[["memory","メモリー"],["ssd","SSD"],["gpu","グラフィック"],["psu","電源"]])}${PI("name","パーツ名","text","DDR4-3200 SO-DIMM 16GB ×2")}${PI("priceMin","価格帯 下限（円・目安）","number")}${PI("priceMax","価格帯 上限（円・目安）","number")}
 ${c==="memory"?PS("memType","規格",[["DDR4","DDR4"],["DDR5","DDR5"],["DDR3","DDR3"]])+PS("memForm","形状",[["DIMM","DIMM"],["SO-DIMM","SO-DIMM"]])+PI("memSpeed","速度","number","3200")+PI("moduleGB","1枚の容量GB","number","16")+PI("modules","枚数","number","1")+PS("ecc","ECC",[["no","non-ECC"],["yes","ECC"]]):""}
 ${c==="ssd"?PS("ssdIface","接続",[["NVMe","NVMe"],["SATA","SATA"]])+PS("ssdForm","形状",[["2280","M.2 2280"],["2242","M.2 2242"],["2230","M.2 2230"],["2.5","2.5インチ"]]):""}
 ${c==="gpu"?PS("lowProfile","ロープロファイル",[["yes","対応（ロープロ）"],["no","フルサイズ"]])+PI("tdpW","消費電力W","number")+PS("needsAux","補助電源",[["no","不要"],["yes","必要"]]):""}
 ${c==="psu"?PS("psuType","規格",[["ATX","ATX"],["SFX","SFX"]])+PI("psuWatt","容量W","number"):""}</div><button class="btn" style="margin-top:12px" data-act="savePart">パーツを登録</button></section>`:""}
 ${UI.dtab==="list"?`<section class="card"><h2>登録した型番（${ST.userModels.length}）</h2>${ST.userModels.length?`<ul class="list">${ST.userModels.map(m=>`<li><a href="#pc-${esc(m.id)}">${esc(m.name)}</a><span class="hint" style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((m.sources[m.sources.length-1]||{}).url||"出典なし")}</span><button class="btn g" data-act="rmUM" data-id="${esc(m.id)}" aria-label="削除">✕</button></li>`).join("")}</ul>`:`<p class="hint">まだありません。</p>`}
 <h2 style="margin-top:12px">登録したパーツ（${ST.userParts.length}）</h2>${ST.userParts.length?`<ul class="list">${ST.userParts.map(p=>`<li><span>${esc(p.name)}</span><span class="hint" style="margin:0">${yen(p.priceMin)}〜${yen(p.priceMax)}</span><button class="btn g" data-act="rmUP" data-id="${esc(p.id)}" aria-label="削除">✕</button></li>`).join("")}</ul>`:`<p class="hint">まだありません。</p>`}</section>`:""}
 ${UI.dtab==="backup"?`<section class="card"><p class="hint">登録した型番・パーツ・費用プラン・マイPCのバックアップです。${docRef?"アカウントへの保存はオンになっています（自動保存）。":""}</p>
 <div class="row"><button class="btn" data-act="copyJson">JSONをコピー</button><button class="btn o" data-act="dlJson" id="dlJson" hidden>JSONファイルを保存</button><label class="btn o" style="cursor:pointer">JSONファイルを読み込む<input type="file" id="upJson" accept="application/json,.json" hidden></label></div>
 <label class="f" style="margin-top:12px">またはJSONを貼り付けて読み込み<textarea id="pasteJson" rows="4" placeholder='{"app":"pcfit-pro", ...}'></textarea></label><button class="btn o" style="margin-top:8px" data-act="pasteJson">貼り付けた内容を読み込む</button><p class="hint">読み込むと現在の登録内容は置き換わります。</p></section>`:""}`;}

/* ===== ルーティングと描画 ===== */
const NAV=()=>[["search","型番検索","⌕"],["pc-"+(ST.lastViewed||"none"),"PC詳細","▤"],["plan","費用プラン"+(ST.plan.length?` (${ST.plan.length})`:""),"¥"],["my-pc","マイPC","▣"],["data","データ管理","⛁"]];
const route=()=>(location.hash||"#search").slice(1)||"search";
let downloads=null;
function render(){const r=route(),app=document.getElementById("app");
 const cur=r.startsWith("pc-")?"pc":r==="estimate"?"search":r;
 const nav=NAV().map(([h,l,ic])=>({h,l,ic,on:(h.startsWith("pc-")?"pc":h)===cur}));
 document.getElementById("ntop").innerHTML=nav.map(n=>`<a href="#${n.h}" class="${n.on?"on":""}">${esc(n.l)}</a>`).join("");
 document.getElementById("nbot").innerHTML=nav.map(n=>`<a href="#${n.h}" class="${n.on?"on":""}"><span>${n.ic}</span>${esc(n.l.replace(/ \(\d+\)/,""))}</a>`).join("");
 let h;
 if(r.startsWith("pc-")){const id=r.slice(3);if(id!=="none"&&getModel(id)&&ST.lastViewed!==id){ST.lastViewed=id;persist();}h=vPc(id);}
 else if(r==="plan")h=vPlan();else if(r==="my-pc")h=vMy();else if(r==="data")h=vData();else if(r==="estimate")h=vEst();else h=vSearch();
 app.innerHTML=h;
 if(downloads){const a=document.getElementById("dlPlan"),b=document.getElementById("dlJson");if(a)a.hidden=false;if(b)b.hidden=false;}
}
const exportJson=()=>JSON.stringify(Object.assign({app:"pcfit-pro",version:1,exportedAt:new Date().toISOString()},ST,{estimate:null}),null,2);
const importJson=txt=>{const d=JSON.parse(txt);if(!d||typeof d!=="object")throw new Error("形式が違います");
 update({userModels:Array.isArray(d.userModels)?d.userModels:[],userParts:Array.isArray(d.userParts)?d.userParts:[],plan:Array.isArray(d.plan)?d.plan:[],myPcs:Array.isArray(d.myPcs)?d.myPcs:[]});toast("バックアップを読み込みました");};
const copy=async t=>{try{await navigator.clipboard.writeText(t);toast("コピーしました");}catch(e){toast("コピーできませんでした");}};
const save=async(name,data)=>{if(!downloads)return;try{await downloads.save({filename:name,data});toast("保存しました");}catch(e){toast("保存はキャンセルされました");}};

window.addEventListener("hashchange",()=>{UI.open=null;UI.err="";if(route()!=="data"){UI.edit=null;}window.scrollTo(0,0);render();});
const app=document.getElementById("app");
app.addEventListener("input",e=>{const t=e.target;
 if(t.id==="q"){UI.q=t.value;const pos=t.selectionStart;render();const n=document.getElementById("q");n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}
 else if(t.id==="myq"){UI.myQ=t.value;UI.myPick=null;const pos=t.selectionStart;render();const n=document.getElementById("myq");n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}
 else if(t.dataset.pf&&t.tagName==="INPUT"){UI.pf[t.dataset.pf]=t.value;}});
app.addEventListener("change",e=>{const t=e.target;
 if(t.id==="mk"){UI.maker=t.value;render();}
 else if(t.dataset.pf&&t.tagName==="SELECT"){UI.pf[t.dataset.pf]=t.value;if(t.dataset.pf==="category")render();}
 else if(t.id==="upJson"&&t.files&&t.files[0]){t.files[0].text().then(importJson).catch(err=>toast("読み込めませんでした："+err.message));}});
app.addEventListener("submit",e=>{e.preventDefault();const t=e.target;
 if(t.id==="sf"){const {hits}=search(UI.q,UI.maker);if(hits.length===1)location.hash="pc-"+hits[0].m.id;return;}
 if(t.id==="mf"){const isEst=route()==="estimate",prev=isEst?(UI.preset?null:ST.estimate):(UI.edit?getModel(UI.edit):null);
  const res=readForm(t,prev,!isEst);if(typeof res==="string"){UI.err=res;render();return;}UI.err="";
  if(isEst){res.id="estimate";UI.preset="";update({estimate:res});location.hash="pc-estimate";}
  else{update(s=>({userModels:[res,...s.userModels.filter(x=>x.id!==res.id)]}));toast(UI.edit?"修正を保存しました":"型番を登録しました");UI.edit=null;UI.preset="";location.hash="pc-"+res.id;}}});
app.addEventListener("click",e=>{const b=e.target.closest("button,[data-pick]");if(!b)return;const d=b.dataset;
 if(d.q!==undefined){UI.q=d.q;render();return;}
 if(d.ptab){UI.ptab=d.ptab;UI.open=null;render();return;}
 if(d.dtab){UI.dtab=d.dtab;render();return;}
 if(d.open){UI.open=UI.open===d.open?null:d.open;render();return;}
 if(d.pick){const m=getModel(d.pick);UI.myPick=d.pick;UI.myQ=m?m.name:"";render();return;}
 if(d.qty){update(s=>({plan:s.plan.map(p=>p.id===d.id?Object.assign({},p,{qty:Math.max(1,p.qty+Number(d.qty))}):p)}));return;}
 switch(d.act){
  case "toEst":UI.preset=UI.q;location.hash="estimate";break;
  case "toReg":UI.preset=UI.q;UI.edit=null;UI.dtab="model";location.hash="data";break;
  case "edit":UI.edit=d.id;UI.preset="";UI.dtab="model";location.hash="data";break;
  case "addMy":{const m=getModel(d.id);update(s=>({myPcs:[...s.myPcs,{id:"my-"+Date.now(),nickname:m.name,modelId:m.id,memo:""}]}));toast("マイPCに登録しました");break;}
  case "addMyForm":{const m=getModel(UI.myPick);if(!m)break;const nk=document.getElementById("mynick").value.trim(),mm=document.getElementById("mymemo").value;UI.myQ="";UI.myPick=null;update(s=>({myPcs:[...s.myPcs,{id:"my-"+Date.now(),nickname:nk||m.name,modelId:m.id,memo:mm}]}));toast("マイPCに登録しました");break;}
  case "rmMy":update(s=>({myPcs:s.myPcs.filter(x=>x.id!==d.id)}));break;
  case "addPlan":update(s=>({plan:[...s.plan,{id:"pl-"+Date.now(),modelId:d.m,partId:d.p,qty:1}]}));toast("費用プランに追加しました");break;
  case "rmPlan":update(s=>({plan:s.plan.filter(x=>x.id!==d.id)}));break;
  case "clearPlan":update({plan:[]});break;
  case "copyPlan":copy(planText());break;
  case "dlPlan":save(`upgrade-plan-${new Date().toISOString().slice(0,10)}.txt`,planText());break;
  case "copyJson":copy(exportJson());break;
  case "dlJson":save(`pcfit-backup-${new Date().toISOString().slice(0,10)}.json`,exportJson());break;
  case "pasteJson":try{importJson(document.getElementById("pasteJson").value);}catch(err){toast("読み込めませんでした："+err.message);}break;
  case "rmUM":update(s=>({userModels:s.userModels.filter(x=>x.id!==d.id)}));break;
  case "rmUP":update(s=>({userParts:s.userParts.filter(x=>x.id!==d.id)}));break;
  case "savePart":{const pf=UI.pf,c=pf.category||"memory";if(!String(pf.name||"").trim()||!pf.priceMin||!pf.priceMax){toast("パーツ名と価格帯（下限・上限）を入力してください");break;}
   const p={id:"up-"+Date.now(),category:c,name:pf.name.trim(),priceMin:Number(pf.priceMin),priceMax:Number(pf.priceMax),userAdded:true};
   if(c==="memory")Object.assign(p,{memType:pf.memType||"DDR4",memForm:pf.memForm||"DIMM",memSpeed:Number(pf.memSpeed||3200),moduleGB:Number(pf.moduleGB||16),modules:Number(pf.modules||1),ecc:pf.ecc==="yes"});
   if(c==="ssd")Object.assign(p,{ssdIface:pf.ssdIface||"NVMe",ssdForm:pf.ssdForm||"2280"});
   if(c==="gpu")Object.assign(p,{lowProfile:(pf.lowProfile||"yes")==="yes",tdpW:Number(pf.tdpW||0),needsAux:pf.needsAux==="yes"});
   if(c==="psu")Object.assign(p,{psuType:pf.psuType||"ATX",psuWatt:Number(pf.psuWatt||0)});
   UI.pf={category:c};update(s=>({userParts:[...s.userParts,p]}));toast("パーツを登録しました");break;}
 }});
render();
(async()=>{try{if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){downloads=dl;render();}}}catch(e){}})();
}
</script>
</body>
</html>
